name: Daily Stock Telegram Briefing

on:
  schedule:
    # 한국 시간 기준 월~금요일 오전 07:00 (UTC 기준 일~목요일 22:00)
    - cron: '0 22 * * 0-4'
  workflow_dispatch: # GitHub 웹 UI에서 수동으로 실행 가능하게 설정

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 한국어 폰트 설치 (NanumGothic)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum

      - name: 파이썬 패키지 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 주식 텔레그램 브리핑 스크립트 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python telegram_stock_briefing.py
